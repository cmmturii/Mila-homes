<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmed — Mila Homes</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root{--forest:#2a4a35;--gold:#c9973a;--cream:#f7f3ec;--charcoal:#1e1c18;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"DM Sans",sans-serif;background:var(--cream);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}

    .card{background:white;border-radius:8px;max-width:500px;width:100%;overflow:hidden;box-shadow:0 8px 40px rgba(30,28,24,0.14);}

    /* Header */
    .card-header{background:var(--forest);padding:36px 32px;text-align:center;}
    .check-circle{width:64px;height:64px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.8rem;}
    .card-header h1{font-family:"Playfair Display",serif;color:white;font-size:1.5rem;margin-bottom:4px;}
    .card-header p{color:rgba(255,255,255,0.6);font-size:0.82rem;}

    /* Receipt badge */
    .receipt-badge{margin:24px 24px 0;background:rgba(42,74,53,0.07);border:1px solid rgba(42,74,53,0.15);border-radius:6px;padding:14px;text-align:center;}
    .receipt-badge p{font-size:0.65rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--forest);margin-bottom:4px;font-weight:600;}
    .receipt-num{font-family:"Playfair Display",serif;font-size:1.2rem;color:var(--forest);letter-spacing:0.06em;}

    /* Room image */
    .room-preview{margin:20px 24px 0;height:140px;border-radius:6px;overflow:hidden;display:none;}
    .room-preview img{width:100%;height:100%;object-fit:cover;}
    .room-preview.show{display:block;}

    /* Details */
    .card-body{padding:20px 24px;}
    .detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(30,28,24,0.06);font-size:0.84rem;gap:12px;}
    .detail-row:last-of-type{border-bottom:none;}
    .detail-row .label{color:rgba(30,28,24,0.45);flex-shrink:0;}
    .detail-row .value{color:var(--charcoal);font-weight:500;text-align:right;}
    .total-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:2px solid var(--gold);}
    .total-row .label{font-weight:600;color:var(--forest);font-size:0.9rem;}
    .total-row .amount{font-family:"Playfair Display",serif;font-size:1.6rem;color:var(--gold);}

    /* Actions */
    .actions{padding:0 24px 24px;display:flex;flex-direction:column;gap:10px;}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:4px;font-size:0.76rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:none;transition:all 0.2s;font-family:"DM Sans",sans-serif;}
    .btn-green{background:#25D366;color:white;}
    .btn-green:hover{background:#1da851;transform:translateY(-1px);}
    .btn-outline{background:none;border:1.5px solid rgba(30,28,24,0.14);color:var(--charcoal);}
    .btn-outline:hover{border-color:var(--forest);color:var(--forest);}

    /* Print styles */
    @media print{
      body{background:white;padding:0;}
      .card{box-shadow:none;max-width:100%;}
      .actions{display:none;}
    }
    @media(max-width:480px){
      body{padding:12px;}
      .card-header{padding:28px 20px;}
      .card-body{padding:16px 18px;}
      .actions{padding:0 18px 20px;}
      .receipt-badge,.room-preview{margin-left:18px;margin-right:18px;}
    }
  </style>
</head>
<body>

<div class="card">

  <div class="card-header">
    <div class="check-circle">✅</div>
    <h1>Booking Confirmed!</h1>
    <p>Thank you for choosing Mila Homes, Nyeri</p>
  </div>

  <div class="receipt-badge">
    <p>M-Pesa Receipt Number</p>
    <div class="receipt-num" id="receiptNum">—</div>
  </div>

  <div class="room-preview" id="roomPreview">
    <img id="roomPreviewImg" src="" alt="Room" loading="lazy" />
  </div>

  <div class="card-body">
    <div class="detail-row"><span class="label">Booking ID</span><span class="value" id="detId">—</span></div>
    <div class="detail-row"><span class="label">Guest Name</span><span class="value" id="detName">—</span></div>
    <div class="detail-row"><span class="label">Phone</span><span class="value" id="detPhone">—</span></div>
    <div class="detail-row"><span class="label">Room</span><span class="value" id="detRoom">—</span></div>
    <div class="detail-row"><span class="label">Check-In</span><span class="value" id="detCheckin">—</span></div>
    <div class="detail-row"><span class="label">Check-Out</span><span class="value" id="detCheckout">—</span></div>
    <div class="detail-row"><span class="label">Nights</span><span class="value" id="detNights">—</span></div>
    <div class="detail-row"><span class="label">Guests</span><span class="value" id="detGuests">—</span></div>
    <div class="total-row">
      <span class="label">Total Paid</span>
      <span class="amount" id="detTotal">Ksh —</span>
    </div>
  </div>

  <div class="actions">
    <a id="waLink" href="https://wa.me/254713151177" target="_blank" class="btn btn-green">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Message Us on WhatsApp
    </a>
    <button onclick="window.print()" class="btn btn-outline">🖨️ Print / Save Receipt</button>
    <a href="../index.html" class="btn btn-outline">← Back to Mila Homes</a>
  </div>

</div>

<script>
  const API="https://mila-homes.vercel.app/api";
  const params  = new URLSearchParams(window.location.search);
  const bId     = params.get("booking");
  const receipt = params.get("receipt");

  // 1. Show receipt number immediately
  document.getElementById("receiptNum").textContent = receipt && receipt !== "null" ? receipt : "PENDING";
  document.getElementById("detId").textContent = "#" + (bId || "—");

  // 2. Read from sessionStorage first (instant, no API needed)
  const stored = JSON.parse(sessionStorage.getItem("milaBooking") || "{}");

  if (stored.guestName)  document.getElementById("detName").textContent    = stored.guestName;
  if (stored.guestPhone) document.getElementById("detPhone").textContent   = stored.guestPhone;
  if (stored.room)       document.getElementById("detRoom").textContent    = stored.room;
  if (stored.checkin)    document.getElementById("detCheckin").textContent = new Date(stored.checkin+"T00:00").toDateString();
  if (stored.checkout)   document.getElementById("detCheckout").textContent= new Date(stored.checkout+"T00:00").toDateString();
  if (stored.nights)     document.getElementById("detNights").textContent  = stored.nights + (stored.nights>1?" nights":" night");
  if (stored.guests)     document.getElementById("detGuests").textContent  = stored.guests + (stored.guests>1?" guests":" guest");
  if (stored.total)      document.getElementById("detTotal").textContent   = "Ksh " + Number(stored.total).toLocaleString();

  // Show room image if available
  if (stored.image) {
    const preview = document.getElementById("roomPreview");
    const img = document.getElementById("roomPreviewImg");
    img.src = stored.image;
    img.onerror = () => { preview.style.display = "none"; };
    preview.classList.add("show");
  }

  // Update WhatsApp link with booking details
  if (stored.guestName && stored.room) {
    const waMsg = encodeURIComponent(`Hi Mila Homes! My booking is confirmed.\nName: ${stored.guestName}\nRoom: ${stored.room}\nCheck-in: ${stored.checkin}\nReceipt: ${receipt}`);
    document.getElementById("waLink").href = `https://wa.me/254713151177?text=${waMsg}`;
  }

  // 3. Also try API for full details (if backend connected)
  if (bId && !bId.startsWith("LOCAL") && !bId.startsWith("DEV")) {
    fetch(`${API}/bookings/${bId}`)
      .then(r => r.json())
      .then(b => {
        if (b.guest_name)  document.getElementById("detName").textContent    = b.guest_name;
        if (b.guest_phone) document.getElementById("detPhone").textContent   = b.guest_phone;
        if (b.rooms?.name) document.getElementById("detRoom").textContent    = b.rooms.name;
        if (b.check_in)    document.getElementById("detCheckin").textContent = new Date(b.check_in+"T00:00").toDateString();
        if (b.check_out)   document.getElementById("detCheckout").textContent= new Date(b.check_out+"T00:00").toDateString();
        if (b.nights)      document.getElementById("detNights").textContent  = b.nights + " nights";
        if (b.guests)      document.getElementById("detGuests").textContent  = b.guests + " guests";
        const paid = b.amount_paid || b.total_price;
        if (paid)          document.getElementById("detTotal").textContent   = "Ksh " + Number(paid).toLocaleString();
        if (b.mpesa_receipt) document.getElementById("receiptNum").textContent = b.mpesa_receipt;
      }).catch(() => {});
  }

  // Clear session after reading (tidy up)
  setTimeout(() => sessionStorage.removeItem("milaBooking"), 5000);
</script>

</body>
</html>
